[project]
name = "cwa-ingest"
version = "0.1.0"
description = "Transcribe, attribute and index Ayman's talks for coffeewithayman.com/talks"
requires-python = ">=3.12,<3.13"
dependencies = [
  "whisperx>=3.4",
  "speechbrain>=1.0",
  "yt-dlp",
  "static-ffmpeg",
  "watchdog>=5",
  "anthropic",
  "rapidfuzz",
  "numpy",
  "wordfreq",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
cwa-ingest = "cwa_ingest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cwa_ingest"]

[tool.uv]
python-preference = "managed"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
